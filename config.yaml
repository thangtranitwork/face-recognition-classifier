# ============================================================
# Face Recognition Classifier - Cấu hình
# ============================================================

# Đường dẫn tới thư mục gốc chứa tất cả thư mục ảnh
dataset_root: "./dataset"

# Tên thư mục chứa ảnh CHƯA phân loại (sẽ được đổi tên/gom nhóm)
unclassified_dir: "chua_phan_loai"

# ============================================================
# Exclude directories
# Các thư mục KHÔNG dùng làm known faces (bỏ qua khi nạp)
# ============================================================
exclude_dirs:
  - "chua_phan_loai"   # Thư mục cần xử lý
  - "khac"             # Người khác / không rõ danh tính
  - "other"            # Ảnh không phân loại theo người
  - "sensitive"        # Thư mục chứa ảnh/video nhạy cảm đã phân loại
  - "GV"
  - "DD"
  - "N"
  - "Ng"
  - "Nhiều"
  - "neko"
  - "S"
  - "ADT"
  - "NCDK"

# ============================================================
# Nhận diện khuôn mặt (Engine & Model)
# ============================================================

# Engine nhận diện: "insightface" (RetinaFace + ArcFace) hoặc "dlib"
engine: "insightface"

# Model của InsightFace:
#   "buffalo_sc" - Nhẹ ~150MB, nhanh, phù hợp máy yếu
#   "buffalo_l"  - Lớn ~450MB, độ chính xác cao nhất ~10-15%
insightface_model: "buffalo_l"

# Tối ưu hóa tốc độ: Chỉ nạp module phát hiện và trích xuất vector
# (Bỏ qua 3 model thừa: landmark_2d, landmark_3d, genderage)
allowed_modules:
  - "detection"
  - "recognition"

# Ngưỡng chất lượng khuôn mặt (det_score từ RetinaFace, 0.0 - 1.0)
# Giúp loại bỏ các khuôn mặt mờ, nhòe hoặc quá nhỏ
det_thresh: 0.6

# Ngưỡng Cosine Similarity cho InsightFace (0.0 - 1.0; càng cao càng chặt)
# buffalo_sc: 0.38; buffalo_l: 0.35 (cùng người thường: 0.45 - 0.90+)
cosine_threshold: 0.35

# Xử lý khi có nhiều khuôn mặt trong ảnh:
#   "largest" - Chọn mặt có diện tích khung hình lớn nhất (nhân vật chính)
#   "reject"  - Bỏ qua ảnh có nhiều mặt
multi_face_strategy: "largest"

# Ngưỡng chênh lệch Cosine Similarity giữa Candidate #1 và Candidate #2 (Margin check)
margin_threshold: 0.04

# Giới hạn kích thước cạnh ảnh tối đa khi đọc (pixel) để tiết kiệm RAM & CPU
image_max_size: 1600

# Seed ngẫu nhiên lấy mẫu ảnh training để đảm bảo tính nhất quán giữa các lần chạy
random_seed: 42

# Số lượng ảnh tối đa lấy từ mỗi thư mục người để nạp known faces
max_images_per_person: 50

# ============================================================
# Cấu hình dự phòng cho dlib legacy (nếu dùng engine: "dlib")
# ============================================================
tolerance: 0.57
top_k_neighbors: 3
model: "hog"
num_jitters: 2

# ============================================================
# Xử lý Video (Frame Sampling)
# ============================================================
# Số lượng khung hình lấy trải đều từ mỗi video để nhận diện
sample_frames_per_video: 12

# ============================================================
# Auto-Clustering (Gom nhóm tự động khuôn mặt người lạ)
# ============================================================

# Ngưỡng khoảng cách tối đa để gom thành cùng 1 người:
# - Với InsightFace (Cosine metric): 0.38 - 0.45 (khuyên dùng: 0.40)
cluster_eps_cosine: 0.40

# - Với dlib (Euclidean metric): 0.35 - 0.40 (khuyên dùng: 0.38)
cluster_eps_dlib: 0.38

# Số lượng ảnh/video tối thiểu để tạo thành 1 nhóm người mới
cluster_min_samples: 2

# Tiền tố tên thư mục cho nhóm người mới được tạo (ví dụ: nguoi_moi_1, nguoi_moi_2)
cluster_prefix: "nguoi_moi"

# ============================================================
# Đặt tên file - Confidence tiers
# ============================================================

# Ngưỡng confidence THẤP (%) - dưới mức này dùng low_confidence_format
low_confidence_threshold: 45

# Định dạng tên tệp cho ảnh nhận diện độ tin cậy cao
name_format: "{person}_{original}"

# Định dạng tên tệp cho ảnh nhận diện độ tin cậy thấp (prefix "low_" để kiểm tra thủ công)
low_confidence_format: "low_{person}_{original}"

# Tiền tố cho ảnh không nhận diện được hoặc không có khuôn mặt
unknown_prefix: "unknown"

# ============================================================
# Kiểm duyệt nội dung nhạy cảm (NudeNet NSFW)
# ============================================================
# Bật kiểm tra nội dung nhạy cảm khi nhận diện
enable_sensitive_check: false

# Chế độ xử lý khi phát hiện ảnh nhạy cảm:
#   "rename" - Đổi tên trực tiếp với tiền tố (ví dụ: sensitive_sontung_01.jpg)
#   "copy"   - Đổi tên bình thường và tạo thêm 1 bản sao đánh dấu sensitive
sensitive_mode: "rename"

# Ngưỡng phát hiện NudeNet (0.0 - 1.0; khuyên dùng 0.35)
sensitive_threshold: 0.35

# Tiền tố đánh dấu ảnh nhạy cảm
sensitive_prefix: "sensitive"

# ============================================================
# Bộ nhớ đệm (Cache)
# ============================================================

# Bật/tắt cache encodings (khuyên dùng true để tăng tốc tối đa)
use_cache: true

# Tên file cache (lưu tại dataset_root)
cache_file: ".face_encodings_cache.pkl"

# ============================================================
# Logging
# ============================================================
log_to_file: true
log_file: "rename_log.txt"
